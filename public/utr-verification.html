<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">UTR Verification | Moonland & Ninja Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    fetch('/api/admin/check-session').then(res => res.json()).then(data => {
      if (!data.authenticated) window.location.href = 'admin-login.html';
    }).catch(() => {
      window.location.href = 'admin-login.html';
    });
  </script>
</head>
<body class="bg-[#050505] text-slate-100 min-h-screen font-sans p-6 sm:p-10 space-y-8 selection:bg-white selection:text-black">
  
  <!-- Hidden Audio for Beep Alert -->
  <audio id="alertAudio" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header & Locked Single-Line Navigation Bar -->
    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 pb-6 border-b border-zinc-900">
      <div>
        <h1 class="text-2xl font-black text-white uppercase tracking-wider flex items-center gap-3">
          <span id="livePulseDot" class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></span>
          UTR Payment Verification Queue
        </h1>
        <p class="text-xs text-zinc-400 tracking-wide mt-1">Review pending bank payment UTRs from Firestore, approve orders & check rejected records</p>
      </div>
      
      <!-- Locked Single-Row Navigation Bar -->
      <nav class="flex flex-row flex-nowrap items-center gap-0.5 text-[9.5px] font-bold uppercase tracking-wider whitespace-nowrap overflow-x-auto max-w-full pb-1">
        <a href="dash-analytics-9x81.html" class="bg-black text-zinc-400 hover:text-white border border-zinc-800 px-2.5 py-2 transition">Dashboard</a>
        <a href="utr-verification.html" class="bg-cyan-400 text-black border border-cyan-400 px-2.5 py-2 shadow-[0_0_15px_rgba(34,211,238,0.3)] transition flex items-center gap-1.5">
          UTR Verification 
          <span id="navUtrBadge" class="bg-black text-cyan-400 text-[9px] px-1.5 py-0.5 font-black hidden">0</span>
        </a>
        <a href="manage-orders-8118.html" class="bg-black text-zinc-400 hover:text-white border border-zinc-800 px-2.5 py-2 transition">Orders</a>
        <a href="inventory-products.html" class="bg-black text-zinc-400 hover:text-white border border-zinc-800 px-2.5 py-2 transition">Products</a>
        <a href="customers-crm.html" class="bg-black text-zinc-400 hover:text-white border border-zinc-800 px-2.5 py-2 transition">Customers</a>
        <a href="referral-payouts.html" class="bg-black text-zinc-400 hover:text-white border border-zinc-800 px-2.5 py-2 transition">Referrals</a>
        <a href="settings-gateways.html" class="bg-black text-zinc-400 hover:text-white border border-zinc-800 px-2.5 py-2 transition">Settings</a>
      </nav>
    </div>

    <!-- Tabs for Pending and Rejected UTRs -->
    <div class="flex items-center justify-between border-b border-zinc-900 pb-4">
      <div class="flex items-center gap-3">
        <button onclick="switchTab('pending')" id="tabBtnPending" class="bg-cyan-400 text-black font-black px-5 py-2.5 text-xs uppercase tracking-wider transition">Pending UTRs</button>
        <button onclick="switchTab('rejected')" id="tabBtnRejected" class="bg-black border border-zinc-800 text-zinc-400 hover:text-white font-bold px-5 py-2.5 text-xs uppercase tracking-wider transition">Rejected UTRs</button>
      </div>
      <button onclick="enableSound()" id="soundToggleBtn" class="bg-zinc-900 text-cyan-400 border border-cyan-400/30 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider">🔔 Enable Sound Alert</button>
    </div>

    <!-- Queue Containers -->
    <div id="utrQueueContainer" class="space-y-4"></div>
  </div>

  <!-- Modern Custom Toast Notification -->
  <div id="customToast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-[rgba(12,12,12,0.95)] border border-cyan-400/40 px-6 py-4 shadow-2xl flex items-center gap-3">
        <div class="w-8 h-8 bg-cyan-400/20 text-cyan-400 flex items-center justify-center font-bold">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
            <h4 class="text-xs font-bold text-white uppercase tracking-wider" id="toastTitle">Success</h4>
            <p class="text-[11px] text-zinc-400" id="toastMessage">Action successfully complete ho gaya hai!</p>
        </div>
    </div>
  </div>

  <script>
    let cachedPendingOrders = [];
    let cachedRejectedOrders = [];
    let currentTab = 'pending';
    let previousPendingCount = null;
    let soundAllowed = false;

    document.addEventListener("DOMContentLoaded", () => {
        fetchUtrQueue();
        setInterval(fetchUtrQueue, 5000);
    });

    function enableSound() {
        soundAllowed = true;
        const audio = document.getElementById('alertAudio');
        audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('soundToggleBtn').innerText = '🔔 Sound Alert Active';
            document.getElementById('soundToggleBtn').className = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider';
            showToast('Sound Enabled', 'Ab naya UTR aane par alert sound bajega!');
        }).catch(err => {
            console.log('Audio enable error:', err);
        });
    }

    function playAlertSound() {
        if (!soundAllowed) return;
        try {
            const audio = document.getElementById('alertAudio');
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Playback prevented:', e));
        } catch (e) {
            console.log('Audio error:', e);
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        if (tab === 'pending') {
            document.getElementById('tabBtnPending').className = "bg-cyan-400 text-black font-black px-5 py-2.5 text-xs uppercase tracking-wider transition";
            document.getElementById('tabBtnRejected').className = "bg-black border border-zinc-800 text-zinc-400 hover:text-white font-bold px-5 py-2.5 text-xs uppercase tracking-wider transition";
            renderUtrQueue();
        } else {
            document.getElementById('tabBtnRejected').className = "bg-cyan-400 text-black font-black px-5 py-2.5 text-xs uppercase tracking-wider transition";
            document.getElementById('tabBtnPending').className = "bg-black border border-zinc-800 text-zinc-400 hover:text-white font-bold px-5 py-2.5 text-xs uppercase tracking-wider transition";
            renderRejectedQueue();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function showToast(title, message) {
        const toast = document.getElementById('customToast');
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastMessage').innerText = message;
        toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        }, 3000);
    }

    function updateNavBadge(count) {
        const badge = document.getElementById('navUtrBadge');
        if (count > 0) {
            badge.innerText = count;
            badge.classList.remove('hidden');
            document.getElementById('pageTitle').innerText = `(${count}) UTR Verification | Moonland & Ninja Admin`;
        } else {
            badge.classList.add('hidden');
            document.getElementById('pageTitle').innerText = `UTR Verification | Moonland & Ninja Admin`;
        }
    }

    async function fetchUtrQueue() {
        try {
            const res = await fetch('/api/orders');
            if (res.ok) {
                const allOrders = await res.json();
                const newPending = allOrders.filter(o => (!o.utrVerified && o.status !== 'Rejected') || o.status === 'Payment Verification Pending');
                
                if (previousPendingCount !== null && newPending.length > previousPendingCount) {
                    playAlertSound();
                    showToast('New UTR Received!', 'Ek naya payment UTR verification ke liye aaya hai.');
                    const dot = document.getElementById('livePulseDot');
                    dot.className = "w-3 h-3 bg-amber-400 rounded-full animate-ping";
                    setTimeout(() => { dot.className = "w-3 h-3 bg-cyan-400 rounded-full animate-pulse"; }, 4000);
                }

                previousPendingCount = newPending.length;
                cachedPendingOrders = newPending;
                cachedRejectedOrders = allOrders.filter(o => o.status === 'Rejected');
                
                updateNavBadge(cachedPendingOrders.length);
                
                if (currentTab === 'pending') renderUtrQueue();
                else renderRejectedQueue();
            }
        } catch (err) {
            console.error('Failed to fetch UTR queue from server:', err);
        }
    }

    function renderUtrQueue() {
      const container = document.getElementById('utrQueueContainer');

      if (!cachedPendingOrders || cachedPendingOrders.length === 0) {
        container.innerHTML = `
          <div class="bg-[rgba(12,12,12,0.7)] border border-white/10 p-10 text-center text-zinc-500 text-xs uppercase tracking-widest shadow-xl rounded-none">
            <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-3 block"></i>
            No Pending UTR Orders Found. New submissions will appear here live.
          </div>`;
        return;
      }

      container.innerHTML = '';
      cachedPendingOrders.forEach((ord) => {
        const itemsText = ord.items ? ord.items.map(i => i.name).join(', ') : (ord.product || 'Appliance Product');
        const formattedDate = ord.createdAt ? new Date(ord.createdAt).toLocaleString('en-IN') : 'N/A';
        
        const card = document.createElement('div');
        card.className = "bg-[rgba(12,12,12,0.7)] border border-white/10 p-6 space-y-4 text-xs shadow-xl rounded-none";
        
        card.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 pb-3 border-b border-zinc-900">
            <div>
              <span class="text-zinc-400">Order ID:</span> <strong class="text-cyan-400 font-mono text-sm">${escapeHtml(ord.id)}</strong>
              <span class="text-zinc-500 text-[10px] ml-2 font-mono">(${escapeHtml(formattedDate)})</span>
            </div>
            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 font-bold uppercase tracking-wider text-[10px]">
              <i class="fa-solid fa-clock mr-1"></i> UTR Verification Pending
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-zinc-300 bg-black border border-zinc-800 p-4 font-mono">
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Customer Name:</span><strong class="text-white text-sm uppercase">${escapeHtml(ord.customer || ord.name)}</strong></div>
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Mobile Number:</span><strong class="text-cyan-400 text-sm">${escapeHtml(ord.phone)}</strong></div>
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Payment UTR / Ref No:</span><strong class="text-amber-300 text-sm">${escapeHtml(ord.utr)}</strong></div>
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Total Amount:</span><strong class="text-emerald-400 text-sm">₹${escapeHtml(ord.totalAmount || '0')}</strong></div>
          </div>

          <div class="space-y-1.5 bg-black border border-zinc-800 p-3.5 text-[11px] text-zinc-400 font-mono">
            <p>Items: <strong class="text-slate-200">${escapeHtml(itemsText)}</strong></p>
            <p>Address: <span class="text-slate-300">${escapeHtml(ord.address)}</span></p>
            <p>UPI ID: <span class="text-cyan-400">${escapeHtml(ord.upiId || 'N/A')}</span></p>
            <p>Referral Code: <span class="text-amber-400">${escapeHtml(ord.enteredRefCode || 'None')}</span></p>
          </div>

          <div class="flex flex-wrap items-center justify-end gap-3 pt-2">
            <button class="reject-btn bg-zinc-900 hover:bg-rose-950 text-rose-400 border border-zinc-800 hover:border-rose-900 px-4 py-2.5 font-bold uppercase tracking-wider transition">
              <i class="fa-solid fa-xmark mr-1"></i> Reject UTR
            </button>
            <button class="approve-btn bg-cyan-400 hover:bg-cyan-300 text-black font-black px-6 py-2.5 shadow-lg transition flex items-center gap-2 uppercase tracking-wider">
              <i class="fa-brands fa-whatsapp text-sm"></i> Approve & Share WhatsApp Link
            </button>
          </div>
        `;

        card.querySelector('.reject-btn').addEventListener('click', () => rejectUtrOrder(ord.id));
        card.querySelector('.approve-btn').addEventListener('click', () => approveUtrOrder(ord));

        container.appendChild(card);
      });
    }

    function renderRejectedQueue() {
      const container = document.getElementById('utrQueueContainer');

      if (!cachedRejectedOrders || cachedRejectedOrders.length === 0) {
        container.innerHTML = `
          <div class="bg-[rgba(12,12,12,0.7)] border border-white/10 p-10 text-center text-zinc-500 text-xs uppercase tracking-widest shadow-xl rounded-none">
            <i class="fa-solid fa-circle-xmark text-rose-400 text-3xl mb-3 block"></i>
            No Rejected UTR Orders Found.
          </div>`;
        return;
      }

      container.innerHTML = '';
      cachedRejectedOrders.forEach((ord) => {
        const itemsText = ord.items ? ord.items.map(i => i.name).join(', ') : (ord.product || 'Appliance Product');
        const formattedDate = ord.createdAt ? new Date(ord.createdAt).toLocaleString('en-IN') : 'N/A';
        
        const card = document.createElement('div');
        card.className = "bg-[rgba(12,12,12,0.7)] border border-white/10 p-6 space-y-4 text-xs shadow-xl rounded-none opacity-80";
        
        card.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 pb-3 border-b border-zinc-900">
            <div>
              <span class="text-zinc-400">Order ID:</span> <strong class="text-cyan-400 font-mono text-sm">${escapeHtml(ord.id)}</strong>
              <span class="text-zinc-500 text-[10px] ml-2 font-mono">(${escapeHtml(formattedDate)})</span>
            </div>
            <span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 font-bold uppercase tracking-wider text-[10px]">
              <i class="fa-solid fa-xmark mr-1"></i> UTR Rejected
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-zinc-300 bg-black border border-zinc-800 p-4 font-mono">
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Customer Name:</span><strong class="text-white text-sm uppercase">${escapeHtml(ord.customer || ord.name)}</strong></div>
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Mobile Number:</span><strong class="text-cyan-400 text-sm">${escapeHtml(ord.phone)}</strong></div>
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Payment UTR / Ref No:</span><strong class="text-amber-300 text-sm">${escapeHtml(ord.utr)}</strong></div>
            <div><span class="text-zinc-500 text-[10px] uppercase block mb-0.5">Total Amount:</span><strong class="text-emerald-400 text-sm">₹${escapeHtml(ord.totalAmount || '0')}</strong></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function approveUtrOrder(ord) {
      try {
        const res = await fetch(`/api/orders/${ord.id}/approve`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' }
        });

        const result = await res.json();
        if (res.ok && result.success) {
          const generatedRefCode = result.userRefCode;
          const autoShareUrl = `${window.location.origin}/order.html?ref=${generatedRefCode}`;
          const message = `Hello *${ord.customer || ord.name}*,\n\n🎉 Aapka payment (UTR: *${ord.utr}*) verify ho gaya hai!\n\nAapka Order ID: *${ord.id}*\nAapka Exclusive Referral Code: *${generatedRefCode}*\n\nAapka Share Link:\n${autoShareUrl}\n\nIs link ko share karein, samne wale ko code dalne ki zarurat nahi padegi! 🚀`;

          window.open(`https://wa.me/91${ord.phone}?text=${encodeURIComponent(message)}`, '_blank');
          showToast('Approved', 'UTR successfully verify aur approve ho gaya hai!');
          fetchUtrQueue();
        } else {
          showToast('Error', result.error || 'Failed to approve order on server');
        }
      } catch (err) {
        console.error('Server error during approval:', err);
        showToast('Error', 'Server connection error');
      }
    }

    async function rejectUtrOrder(orderId) {
      if (!confirm('Kya aap is UTR ko reject karna chahte hain?')) return;

      try {
        const res = await fetch(`/api/orders/${orderId}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          showToast('Rejected', 'UTR ko reject kar diya gaya hai.');
          fetchUtrQueue();
        } else {
          showToast('Error', 'Failed to update order status on server');
        }
      } catch (err) {
        console.error('Server error during rejection:', err);
        showToast('Error', 'Server connection error');
      }
    }
  </script>
</body>
</html>
