<script>
    let currentFilter = 'All';
    let cachedOrders = [];

    document.addEventListener("DOMContentLoaded", () => fetchOrdersAndRender());

    function showToast(title, message) {
        const toast = document.getElementById('customToast');
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastMessage').innerText = message;
        toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        }, 3000);
    }

    function setPayoutFilter(filter) {
      currentFilter = filter;
      document.getElementById('filterBtnAll').className = filter === 'All' ? 'bg-cyan-400 text-black font-black px-4 py-2.5 text-xs uppercase tracking-wider transition shadow-[0_0_15px_rgba(34,211,238,0.2)]' : 'bg-black border border-zinc-800 text-zinc-400 hover:text-white font-bold px-4 py-2.5 text-xs uppercase tracking-wider transition';
      document.getElementById('filterBtnPending').className = filter === 'Pending' ? 'bg-cyan-400 text-black font-black px-4 py-2.5 text-xs uppercase tracking-wider transition shadow-[0_0_15px_rgba(34,211,238,0.2)]' : 'bg-black border border-zinc-800 text-zinc-400 hover:text-white font-bold px-4 py-2.5 text-xs uppercase tracking-wider transition';
      document.getElementById('filterBtnPaid').className = filter === 'Paid' ? 'bg-cyan-400 text-black font-black px-4 py-2.5 text-xs uppercase tracking-wider transition shadow-[0_0_15px_rgba(34,211,238,0.2)]' : 'bg-black border border-zinc-800 text-zinc-400 hover:text-white font-bold px-4 py-2.5 text-xs uppercase tracking-wider transition';
      renderPayoutsHistory();
    }

    function clearFilters() {
      document.getElementById('payoutSearchInput').value = '';
      document.getElementById('payoutDateFilter').value = '';
      document.getElementById('typeFilterSelect').value = 'all';
      document.getElementById('payoutSortSelect').value = 'newest';
      renderPayoutsHistory();
    }

    async function fetchOrdersAndRender() {
      try {
        const res = await fetch('/api/orders');
        if (res.ok) {
          cachedOrders = await res.json();
        } else {
          cachedOrders = [];
        }
      } catch (err) {
        console.error('Failed to fetch orders from server:', err);
        cachedOrders = [];
      }
      renderPayoutsHistory();
    }

    function renderPayoutsHistory() {
      const orders = cachedOrders;
      const container = document.getElementById('payoutHistoryContainer');
      const searchQuery = document.getElementById('payoutSearchInput').value.toLowerCase().trim();
      const selectedDate = document.getElementById('payoutDateFilter').value;
      const typeVal = document.getElementById('typeFilterSelect').value;
      const sortVal = document.getElementById('payoutSortSelect').value;

      let totalPaidCount = 0;
      let pendingCount = 0;
      orders.forEach(o => {
        if ((o.payoutStatus || 'Pending') === 'Paid') totalPaidCount++;
        else pendingCount++;
      });

      document.getElementById('statTotalPaidAmount').innerText = `₹${(totalPaidCount * 1000).toLocaleString('en-IN')}`;
      document.getElementById('statPendingCount').innerText = pendingCount;
      document.getElementById('statPaidCount').innerText = totalPaidCount;

      let filteredOrders = orders.filter(o => {
        const status = o.payoutStatus || 'Pending';
        if (currentFilter === 'Paid' && status !== 'Paid') return false;
        if (currentFilter === 'Pending' && status === 'Paid') return false;

        const enteredCode = (o.enteredRefCode || 'Direct').trim();
        const isDirect = !o.enteredRefCode || enteredCode.toLowerCase() === 'none' || enteredCode.toLowerCase() === 'direct' || enteredCode === '';

        if (typeVal === 'direct' && !isDirect) return false;
        if (typeVal === 'referral' && isDirect) return false;

        let referrer = orders.find(item => item.userRefCode && item.userRefCode.toLowerCase() === enteredCode.toLowerCase());
        let referrerName = referrer ? (referrer.customer || referrer.name || '').toLowerCase() : 'direct / unknown referrer';
        const buyerName = (o.customer || o.name || '').toLowerCase();
        const buyerPhone = (o.phone || '').toLowerCase();
        const orderId = (o.id || '').toLowerCase();

        const matchesSearch = !searchQuery || referrerName.includes(searchQuery) || buyerName.includes(searchQuery) || buyerPhone.includes(searchQuery) || enteredCode.toLowerCase().includes(searchQuery) || orderId.includes(searchQuery);
        if (!matchesSearch) return false;

        if (selectedDate) {
          const rawDate = o.createdAt || o.timestamp || o.date;
          if (!rawDate) return false;
          const orderDateStr = new Date(rawDate).toISOString().split('T')[0];
          if (orderDateStr !== selectedDate) return false;
        }

        return true;
      });

      let referrerCounts = {};
      orders.forEach(o => {
        const code = o.enteredRefCode || 'Direct';
        let refObj = orders.find(item => item.userRefCode === code);
        let refName = refObj ? (refObj.customer || refObj.name) : 'Direct / Unknown Referrer';
        if ((o.payoutStatus || 'Pending') === 'Paid') {
          referrerCounts[refName] = (referrerCounts[refName] || 0) + 1;
        }
      });

      // Sorting Logic
      filteredOrders.sort((a, b) => {
        const timeA = new Date(a.createdAt || a.timestamp || 0).getTime();
        const timeB = new Date(b.createdAt || b.timestamp || 0).getTime();

        if (sortVal === 'newest') return timeB - timeA;
        if (sortVal === 'oldest') return timeA - timeB;

        let refA = orders.find(item => item.userRefCode === (a.enteredRefCode || 'Direct'));
        let nameA = refA ? (refA.customer || refA.name) : 'Direct / Unknown Referrer';
        let refB = orders.find(item => item.userRefCode === (b.enteredRefCode || 'Direct'));
        let nameB = refB ? (refB.customer || refB.name) : 'Direct / Unknown Referrer';

        if (sortVal === 'topEarners') {
          return (referrerCounts[nameB] || 0) - (referrerCounts[nameA] || 0);
        } else if (sortVal === 'lowEarners') {
          return (referrerCounts[nameA] || 0) - (referrerCounts[nameB] || 0);
        }
        return timeB - timeA;
      });

      if (filteredOrders.length === 0) {
        container.innerHTML = `<div class="bg-[rgba(12,12,12,0.7)] border border-white/10 p-10 text-center text-zinc-500 text-xs uppercase tracking-widest shadow-xl">Is search ya filter ke mutabiq koi referral payout record nahi mila.</div>`;
        return;
      }

      container.innerHTML = '';
      filteredOrders.forEach(o => {
        const payoutStatus = o.payoutStatus || 'Pending';
        const enteredCode = o.enteredRefCode || 'Direct';
        const orderDate = o.createdAt || o.timestamp ? new Date(o.createdAt || o.timestamp).toLocaleString('en-IN') : (o.date || 'N/A');
        
        const paidTimeText = o.payoutPaidAt ? `<span class="text-emerald-400 ml-2 font-mono">| Paid At: ${o.payoutPaidAt}</span>` : '';

        let referrer = orders.find(item => item.userRefCode && item.userRefCode.toLowerCase() === enteredCode.toLowerCase());
        let referrerName = referrer ? (referrer.customer || referrer.name) : 'Direct / Unknown Referrer';
        let referrerUpi = referrer ? (referrer.upiId || 'N/A') : 'N/A';
        let buyerName = o.customer || o.name;
        let buyerPhone = o.phone;

        const whatsappButtonHtml = payoutStatus === 'Paid' ? `
          <button onclick="sendPayoutWhatsApp('${referrerName}', '${buyerName}', '${referrerUpi}', '${referrerPhone}')" class="bg-cyan-400 hover:bg-cyan-300 text-black font-black px-4 py-2.5 flex items-center gap-2 shadow-lg transition uppercase tracking-wider text-[11px]">
            <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp Alert
          </button>
        ` : '';

        container.innerHTML += `
          <div class="bg-[rgba(12,12,12,0.7)] border border-white/10 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-xs shadow-xl rounded-none">
            <div class="space-y-2">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-none ${payoutStatus === 'Paid' ? 'bg-emerald-400' : 'bg-amber-400'}"></span>
                <strong class="text-white text-sm uppercase tracking-wider">Payout Target: ${referrerName}</strong>
              </div>
              <p class="text-zinc-400 font-mono">Referral Code Used: <code class="text-cyan-400 font-bold">${enteredCode}</code> | Referrer UPI ID: <span class="text-amber-300 font-bold">${referrerUpi}</span></p>
              <p class="text-zinc-500 font-mono text-[11px]">Buyer: ${buyerName} (${buyerPhone}) | Order ID: <span class="text-cyan-400 font-mono">${o.id}</span></p>
              <p class="text-[10px] text-zinc-400 font-mono"><i class="fa-solid fa-clock text-cyan-400 mr-1"></i> Order Time: <span class="text-slate-300 font-medium">${orderDate}</span> ${paidTimeText}</p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
              <div class="flex items-center bg-black p-1 border border-zinc-800 gap-1">
                <button onclick="updatePayoutStatus('${o.id}', 'Paid')" class="px-4 py-2 font-bold uppercase tracking-wider transition ${payoutStatus === 'Paid' ? 'bg-emerald-400 text-black' : 'text-zinc-400 hover:text-white'}">
                  <i class="fa-solid fa-check mr-1"></i> Paid (₹1K)
                </button>
                <button onclick="updatePayoutStatus('${o.id}', 'Pending')" class="px-4 py-2 font-bold uppercase tracking-wider transition ${payoutStatus !== 'Paid' ? 'bg-amber-400 text-black' : 'text-zinc-400 hover:text-white'}">
                  <i class="fa-solid fa-clock mr-1"></i> Unpaid
                </button>
              </div>

              ${whatsappButtonHtml}
            </div>
          </div>
        `;
      });
    }

    async function updatePayoutStatus(orderId, status) {
      try {
        const payload = {
          payoutStatus: status,
          payoutPaidAt: status === 'Paid' ? new Date().toLocaleString('en-IN') : null
        };

        const res = await fetch(`/api/referrals/${orderId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          fetchOrdersAndRender();
          showToast('Status Updated', `Payout status successfully "${status}" set ho gaya hai!`);
        } else {
          showToast('Error', 'Failed to update payout status on server');
        }
      } catch (err) {
        console.error('Server connection error:', err);
        showToast('Error', 'Server connection error');
      }
    }

    function sendPayoutWhatsApp(refName, buyerName, upi, phone) {
      const msg = `Hello *${refName}*,\n\n🎉 Great news! Aapke referral code se *${buyerName}* ne successfully order place kar diya hai.\n\n💰 Aapka ₹1,000 Cash Referral Reward aapke UPI ID (*${upi}*) par process kar diya gaya hai!\n\nThank you for growing with Moonland & Ninja Appliances! 🚀`;
      window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
