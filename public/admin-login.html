<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Login | Moonland & Ninja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex items-center justify-center p-4 sm:p-6 bg-grid-pattern">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Live System Analytics Chart Widget -->
        <div class="apple-card-glass p-6 rounded-3xl border border-slate-800 space-y-4 shadow-2xl bg-slate-900/60">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                    <h2 class="text-xs font-bold text-white uppercase tracking-wider">System Node Status</h2>
                </div>
                <span class="text-[10px] font-mono text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2 py-0.5 rounded-full">v2.4 Live</span>
            </div>

            <!-- Animated Bar Chart -->
            <div class="space-y-3 text-xs">
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                        <span>Database Response Ping</span>
                        <span class="font-mono text-emerald-400 font-bold">14ms</span>
                    </div>
                    <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                        <div class="bg-emerald-400 h-full rounded-full w-[85%]"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                        <span>Server Memory Usage</span>
                        <span class="font-mono text-cyan-400 font-bold">32%</span>
                    </div>
                    <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                        <div class="bg-cyan-400 h-full rounded-full w-[32%]"></div>
                    </div>
                </div>
            </div>

            <!-- Graphical Pulse Metrics Bar Chart -->
            <div class="pt-3 border-t border-slate-800 space-y-2">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">24h Server Activity</p>
                <div class="flex items-end justify-between h-16 gap-1 pt-1 px-1">
                    <div class="w-full bg-cyan-500/20 h-[35%] rounded-t-md"></div>
                    <div class="w-full bg-cyan-500/20 h-[50%] rounded-t-md"></div>
                    <div class="w-full bg-cyan-500/20 h-[40%] rounded-t-md"></div>
                    <div class="w-full bg-cyan-500/20 h-[75%] rounded-t-md"></div>
                    <div class="w-full bg-cyan-500/20 h-[60%] rounded-t-md"></div>
                    <div class="w-full bg-cyan-500/20 h-[90%] rounded-t-md"></div>
                    <div class="w-full bg-cyan-500 h-[100%] rounded-t-md shadow-lg shadow-cyan-500/50"></div>
                </div>
            </div>
        </div>

        <!-- Master Admin Passcode Login Form Card -->
        <div class="apple-card-glass p-8 rounded-3xl border border-slate-800 space-y-6 shadow-2xl bg-slate-900/80">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-cyan-500/15 border border-cyan-500/30 text-cyan-400 rounded-2xl flex items-center justify-center mx-auto text-lg font-black shadow-lg">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-xl font-black text-white">Master Admin Portal</h1>
                <p class="text-xs text-slate-400">Enter secret passcode to access management panels</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">Secret Passcode</label>
                    <input type="password" id="adminPasscodeInput" placeholder="Enter Passcode" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 font-mono tracking-widest text-center shadow-inner">
                </div>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider transition shadow-xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-key"></i> Authenticate & Login
                </button>
            </form>

            <div class="text-center">
                <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition">← Back to Store Home</a>
            </div>
        </div>

    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const passcode = document.getElementById('adminPasscodeInput').value.trim();
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passcode })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    window.location.href = 'dash-analytics-9x81.html';
                } else {
                    alert('Invalid Passcode! Access Denied.');
                    document.getElementById('adminPasscodeInput').value = '';
                }
            } catch (err) {
                alert('Server connection error.');
            }
        }
    </script>
</body>
</html>
